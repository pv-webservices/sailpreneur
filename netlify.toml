# Netlify configuration for cruisejobmentor.com (GitHub auto-deploy).
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

# Deploy previews and branch deploys are built "noindex, follow" so they never compete with the live site.
[context.deploy-preview.environment]
  PUBLIC_NOINDEX = "true"
[context.branch-deploy.environment]
  PUBLIC_NOINDEX = "true"

# ---------- Canonical host: https://cruisejobmentor.com (no www) ----------
# Netlify also upgrades HTTP to HTTPS automatically once the domain certificate is active.
[[redirects]]
  from = "http://cruisejobmentor.com/*"
  to = "https://cruisejobmentor.com/:splat"
  status = 301
  force = true
[[redirects]]
  from = "http://www.cruisejobmentor.com/*"
  to = "https://cruisejobmentor.com/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.cruisejobmentor.com/*"
  to = "https://cruisejobmentor.com/:splat"
  status = 301
  force = true
# "/index.html" variants of every page redirect to the clean URL: see dist/_redirects (generated at build).

# ---------- Headers ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Fingerprinted build assets (CSS/JS/fonts with a content hash in the name) never change.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Optimised images keep stable names, so cache for a week and revalidate in the background.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/thank-you/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
